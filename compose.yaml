name: fibra-resiliente

services:
  db:
    build: ./docker
    environment:
      POSTGRES_DB: fibra
      POSTGRES_USER: fibra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/20-fibra.sql:ro
      - ./red:/data/red:ro
      - ./main.sql:/proyecto/main.sql:ro
      - ./sql:/proyecto/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fibra", "-d", "fibra"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
